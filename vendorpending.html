<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var saved = localStorage.getItem('sa-store-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>Vendor application pending — SA Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav">
    <div class="wrap">
      <a href="index.html" class="nav-brand">
        <span class="logo-mark">SA</span>
        SA Store
      </a>
      <div class="nav-links"></div>
      <div class="nav-cta">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="logout-btn" class="btn btn-ghost">Log out</button>
      </div>
    </div>
  </nav>

  <main class="status-page">
    <div class="status-page-inner">
      <div class="status-badge">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 8v5l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/></svg>
      </div>
      <h1>Your vendor application is pending</h1>
      <p id="status-copy">We review every vendor account before it can bid on devices or list repair services — this usually takes less than a business day. We'll let you know as soon as you're approved.</p>
      <a href="devices.html" class="btn btn-primary">Browse devices in the meantime</a>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If a vendor's status has since been approved, send them straight to the dashboard.
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = "login.html"; return; }
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists && doc.data().status === "active") {
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var saved = localStorage.getItem('sa-store-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>List a device — SA Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav">
    <div class="wrap">
      <a href="index.html" class="nav-brand">
        <span class="logo-mark">SA</span>
        SA Store
      </a>
      <div class="nav-links">
        <a href="devices.html">Browse devices</a>
        <a href="add-device.html">List a device</a>
      </div>
      <div class="nav-cta">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="logout-btn" class="btn btn-ghost">Log out</button>
      </div>
    </div>
  </nav>

  <main class="section" style="padding-top:56px;">
    <div class="wrap" style="max-width:640px;">
      <div class="section-head">
        <h2>List a device</h2>
        <p>Add the details below — vendors will be able to see this and start bidding right away.</p>
      </div>

      <div id="form-error" class="form-error"></div>

      <form id="add-device-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="e.g. iPhone 14 Pro 256GB — Deep Purple" required />
        </div>

        <div class="field">
          <label for="type">Device type</label>
          <select id="type" name="type" required>
            <option value="">Select a type</option>
            <option value="iphone">iPhone</option>
            <option value="macbook">MacBook</option>
            <option value="ipad">iPad</option>
            <option value="airpods">AirPods</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="condition">Condition</label>
          <select id="condition" name="condition" required>
            <option value="">Select condition</option>
            <option value="new">New</option>
            <option value="like_new">Like new</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
            <option value="poor">Poor</option>
          </select>
        </div>

        <div class="field">
          <label>Listing type</label>
          <div class="role-select">
            <div class="role-option">
              <input type="radio" id="mode-sell" name="mode" value="sell" checked />
              <label for="mode-sell">Sell</label>
            </div>
            <div class="role-option">
              <input type="radio" id="mode-exchange" name="mode" value="exchange" />
              <label for="mode-exchange">Exchange</label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="askingPrice">Asking price (USD)</label>
          <input type="text" inputmode="decimal" id="askingPrice" name="askingPrice" placeholder="e.g. 650" />
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" placeholder="Battery health, any scratches, accessories included, etc."></textarea>
        </div>

        <div class="field">
          <label for="images">Photos (up to 5)</label>
          <input type="file" id="images" name="images" accept="image/*" multiple />
          <div id="image-preview" class="image-preview"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Publish listing</button>
      </form>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/devices.js"></script>
</body>
</html>
